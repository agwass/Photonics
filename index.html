<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Photonics Fibre Optics Network Academy · Light. Connect. Transform.</title>

  <!-- ===== PRELOAD CRITICAL FONTS & ICONS ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ============================================================
       MOBILE‑FIRST – fully responsive, clean, no gradients
       ============================================================ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-body: #f2f4f8;
      --bg-card: #ffffff;
      --text-primary: #0f1a2e;
      --text-muted: #5a6a80;
      --brand-cyan: #00a8b8;
      --brand-purple: #7c4cbf;
      --brand-gold: #d48c00;
      --border-light: #e6e9ef;
      --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.06);
      --radius: 20px;
      --radius-sm: 12px;
      --transition: 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      --transition-fast: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font);
      background: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    body.loaded {
      opacity: 1;
    }

    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ===== LOADING ===== */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-body);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid var(--border-light);
      border-top-color: var(--brand-cyan);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .loader-text {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-body);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--brand-cyan);
      border-radius: 12px;
    }

    /* ============================================================
       NAVIGATION – mobile first
       ============================================================ */
    .navbar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 1160px;
      z-index: 1000;
      padding: 10px 16px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: var(--transition-fast);
    }
    .navbar.scrolled {
      top: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 4px 28px rgba(0, 0, 0, 0.06);
    }
    .navbar .container {
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      background: var(--brand-cyan);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-text .brand {
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
    }
    .logo-text .brand span {
      color: var(--brand-cyan);
    }
    .logo-text .sub {
      display: none;
    }

    .nav-links {
      position: fixed;
      top: 0;
      right: -100%;
      width: 75%;
      max-width: 300px;
      height: 100vh;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(24px);
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      padding: 40px 24px;
      transition: var(--transition-fast);
      border-left: 1px solid var(--border-light);
      box-shadow: -8px 0 40px rgba(0, 0, 0, 0.04);
      display: flex;
    }
    .nav-links.open {
      right: 0;
    }
    .nav-links a {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: var(--transition-fast);
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .nav-links a::after {
      display: none;
    }
    .nav-links a:hover {
      color: var(--text-primary);
    }
    .nav-links .nav-cta {
      background: var(--brand-cyan);
      color: #fff !important;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      border: none;
      text-align: center;
      margin-top: 8px;
    }
    .nav-links .nav-cta:hover {
      background: #0098a6;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      background: transparent;
      border: none;
      z-index: 1001;
    }
    .hamburger span {
      display: block;
      width: 26px;
      height: 2.5px;
      background: var(--text-primary);
      border-radius: 4px;
      transition: var(--transition-fast);
      transform-origin: center;
    }
    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* ============================================================
       HERO
       ============================================================ */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 110px 0 60px;
      background: var(--bg-body);
      overflow: hidden;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      text-align: center;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 168, 184, 0.06);
      border: 1px solid var(--border-light);
      padding: 4px 14px 4px 10px;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--brand-cyan);
