<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Photonics Fibre Optics Network Academy · Light. Connect. Transform.</title>

  <!-- ===== PRELOAD CRITICAL FONTS & ICONS ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ============================================================
       PROFESSIONAL, FULLY RESPONSIVE – mobile‑first, then enhance
       ============================================================ */
    :root {
      --primary-60: #0a3d6b;
      --primary-30: #2980b9;
      --primary-10: #f39c12;
      --bg-body: #f5f7fa;
      --bg-card: #ffffff;
      --text-primary: #0a1e2f;
      --text-muted: #4a5f73;
      --text-light: #7a8fa3;
      --border-light: #e2e8ee;
      --shadow-soft: 0 2px 16px rgba(10, 61, 107, 0.05);
      --shadow-hover: 0 8px 32px rgba(10, 61, 107, 0.08);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      --transition-fast: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font);
      background: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    body.loaded {
      opacity: 1;
    }

    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
    }

    .container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ===== LOADING ===== */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-body);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-ring {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid var(--border-light);
      border-top-color: var(--primary-30);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .loader-text {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-body);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary-30);
      border-radius: 12px;
    }

    /* ============================================================
       NAVIGATION – responsive glass
       ============================================================ */
    .navbar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 1120px;
      z-index: 1000;
      padding: 10px 20px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(14px);
      box-shadow: 0 1px 24px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: var(--transition-fast);
    }
    .navbar.scrolled {
      top: 10px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 2px 28px rgba(10, 61, 107, 0.06);
    }
    .navbar .container {
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .logo .brand {
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
    }
    .logo .brand span {
      color: var(--primary-30);
    }
    .logo .sub {
      display: none;
      font-size: 0.4rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .nav-links {
      position: fixed;
      top: 0;
      right: -100%;
      width: 72%;
      max-width: 300px;
      height: 100vh;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(24px);
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      padding: 40px 28px;
      transition: var(--transition-fast);
      border-left: 1px solid var(--border-light);
      box-shadow: -4px 0 32px rgba(0, 0, 0, 0.02);
      display: flex;
    }
    .nav-links.open {
      right: 0;
    }
    .nav-links a {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: var(--transition-fast);
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .nav-links a::after {
      display: none;
    }
    .nav-links a:hover {
      color: var(--text-primary);
    }
    .nav-links .nav-cta {
      background: var(--primary-30);
      color: #fff !important;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      border: none;
      text-align: center;
      margin-top: 6px;
    }
    .nav-links .nav-cta:hover {
      background: var(--primary-60);
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 4.5px;
      cursor: pointer;
      padding: 6px;
      background: transparent;
      border: none;
      z-index: 1001;
    }
    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text-primary);
      border-radius: 4px;
      transition: var(--transition-fast);
      transform-origin: center;
    }
    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* ============================================================
       HERO – clean, balanced
       ============================================================ */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 0 56px;
      background: var(--bg-body);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      text-align: center;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(41, 128, 185, 0.04);
      border: 1px solid var(--border-light);
      padding: 4px 14px 4px 10px;
      border-radius: 40px;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--primary-30);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0 auto 18px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeSlideUp 0.7s ease 0.1s forwards;
    }
    .hero-badge .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00c853;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.7);
      }
    }
    .hero h1 {
      font-size: clamp(2.2rem, 10vw, 4.4rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeSlideUp 0.8s ease 0.2s forwards;
    }
    .hero h1 .highlight-primary {
      color: var(--primary-60);
    }
    .hero h1 .highlight-secondary {
      color: var(--primary-30);
    }
    .hero h1 .highlight-accent {
      color: var(--primary-10);
    }
    .hero p {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 100%;
      line-height: 1.7;
      margin: 0 auto 20px;
      padding: 0 4px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeSlideUp 0.8s ease 0.35s forwards;
    }
    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeSlideUp 0.8s ease 0.5s forwards;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 60px;
      border: none;
      cursor: pointer;
      transition: var(--transition-fast);
      font-family: inherit;
      background: var(--primary-30);
      color: #fff;
      width: 100%;
      min-height: 50px;
    }
    .btn:hover {
      background: var(--primary-60);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(10, 61, 107, 0.12);
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border-light);
      color: var(--text-primary);
    }
    .btn-outline:hover {
      border-color: var(--primary-30);
      background: rgba(41, 128, 185, 0.02);
    }
    .btn-gold {
      background: var(--primary-10);
      color: #fff;
    }
    .btn-gold:hover {
      background: #e08e0b;
      box-shadow: 0 6px 24px rgba(243, 156, 18, 0.15);
    }
    .btn-sm {
      padding: 10px 20px;
      font-size: 0.85rem;
      min-height: 42px;
    }
    .hero-stats {
      display: flex;
      justify-content: space-around;
      gap: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--border-light);
      opacity: 0;
      transform: translateY(24px);
      animation: fadeSlideUp 0.8s ease 0.6s forwards;
    }
    .hero-stats .stat h3 {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-primary);
    }
    .hero-stats .stat p {
      font-size: 0.55rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0;
    }
    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeSlideUp 0.9s ease 0.3s forwards;
    }
    .hero-visual .core-ring {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 61, 107, 0.01);
      border: 1px solid var(--border-light);
    }
    .core-ring .ring-1,
    .core-ring .ring-2 {
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--border-light);
      animation: spin-ring 20s linear infinite;
    }
    .core-ring .ring-1 {
      width: 100%;
      height: 100%;
    }
    .core-ring .ring-2 {
      width: 80%;
      height: 80%;
      animation-direction: reverse;
      animation-duration: 26s;
    }
    @keyframes spin-ring {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    .core-ring .center-content {
      text-align: center;
      z-index: 2;
      padding: 10px;
    }
    .core-ring .center-content .icon-big {
      font-size: 2.6rem;
      display: block;
      margin-bottom: 2px;
      color: var(--primary-30);
      animation: float-icon 5s ease-in-out infinite;
    }
    @keyframes float-icon {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }
    .core-ring .center-content h4 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .core-ring .center-content p {
      font-size: 0.6rem;
      color: var(--text-muted);
      margin: 0;
    }

    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(24px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================================
       SCROLL REVEAL – subtle
       ============================================================ */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-scale {
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal-scale.visible {
      opacity: 1;
      transform: scale(1);
    }

    .stagger-children .stagger-item {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .stagger-children.visible .stagger-item:nth-child(1) {
      transition-delay: 0.04s;
    }
    .stagger-children.visible .stagger-item:nth-child(2) {
      transition-delay: 0.10s;
    }
    .stagger-children.visible .stagger-item:nth-child(3) {
      transition-delay: 0.16s;
    }
    .stagger-children.visible .stagger-item:nth-child(4) {
      transition-delay: 0.22s;
    }
    .stagger-children.visible .stagger-item {
      opacity: 1;
      transform: translateY(0);
    }

    /* ============================================================
       SECTION STYLES – consistent spacing
       ============================================================ */
    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary-30);
      background: rgba(41, 128, 185, 0.03);
      border: 1px solid var(--border-light);
      padding: 3px 12px 3px 10px;
      border-radius: 40px;
      margin-bottom: 10px;
    }
    .section-tag .pulse-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--primary-30);
      animation: pulse-dot 2.2s infinite;
    }
    .section-title {
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: var(--text-primary);
    }
    .section-title .highlight-primary {
      color: var(--primary-60);
    }
    .section-title .highlight-secondary {
      color: var(--primary-30);
    }
    .section-title .highlight-accent {
      color: var(--primary-10);
    }
    .section-sub {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 100%;
      line-height: 1.7;
    }
    .text-center {
      text-align: center;
    }
    .mx-auto {
      margin-left: auto;
      margin-right: auto;
    }
    section {
      padding: 48px 0;
    }

    /* ============================================================
       ABOUT
       ============================================================ */
    #about {
      background: var(--bg-card);
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }
    .about-visual {
      background: rgba(10, 61, 107, 0.01);
      border-radius: var(--radius);
      padding: 28px 20px;
      border: 1px solid var(--border-light);
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
    }
    .about-visual:hover {
      transform: scale(1.005);
      box-shadow: var(--shadow-soft);
    }
    .about-visual .quote-box {
      text-align: center;
    }
    .about-visual .quote-box i {
      font-size: 1.8rem;
      color: var(--primary-30);
      opacity: 0.15;
      margin-bottom: 8px;
      display: block;
    }
    .about-visual .quote-box blockquote {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text-muted);
      max-width: 100%;
      line-height: 1.7;
      font-style: italic;
      margin: 0 auto;
    }
    .about-visual .quote-box .cite {
      font-style: normal;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 6px;
      font-size: 0.8rem;
    }
    .about-content .about-stats-mini {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .about-content .about-stats-mini .stat-item {
      background: var(--bg-body);
      padding: 14px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-light);
      text-align: center;
      transition: var(--transition-fast);
    }
    .about-content .about-stats-mini .stat-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
    }
    .about-content .about-stats-mini .stat-item h4 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary-60);
    }
    .about-content .about-stats-mini .stat-item p {
      font-size: 0.55rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0;
    }

    /* ============================================================
       STORY – founder
       ============================================================ */
    #story {
      background: var(--bg-body);
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }
    .story-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      align-items: center;
    }
    .story-visual {
      background: rgba(10, 61, 107, 0.01);
      border-radius: var(--radius);
      padding: 28px 20px;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
      min-height: 160px;
    }
    .story-visual:hover {
      transform: scale(1.005);
      box-shadow: var(--shadow-soft);
    }
    .story-visual .founder-icon {
      text-align: center;
    }
    .story-visual .founder-icon i {
      font-size: 2.8rem;
      color: var(--primary-30);
      opacity: 0.15;
      display: block;
      margin-bottom: 6px;
    }
    .story-visual .founder-icon .initials {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--primary-60);
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .story-visual .founder-icon .title {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .story-content h2 {
      margin-bottom: 6px;
    }
    .story-content .founder-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .story-content .founder-title {
      font-size: 0.85rem;
      color: var(--primary-30);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .story-content p {
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    .story-content .founder-highlights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 14px;
      margin-top: 12px;
    }
    .story-content .founder-highlights li {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .story-content .founder-highlights li i {
      color: var(--primary-10);
      width: 16px;
      font-size: 0.7rem;
    }

    /* ============================================================
       PROGRAMMES
       ============================================================ */
    #programmes {
      background: var(--bg-card);
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }
    .programmes-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin-top: 12px;
      max-width: 740px;
      margin-left: auto;
      margin-right: auto;
    }
    .programme-card {
      background: var(--bg-body);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      transition: var(--transition-fast);
      box-shadow: var(--shadow-soft);
    }
    .programme-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }
    .programme-card .programme-icon {
      font-size: 2rem;
      color: var(--primary-60);
      margin-bottom: 6px;
    }
    .programme-card h3 {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 2px;
      color: var(--text-primary);
    }
    .programme-card .programme-meta {
      font-size: 0.75rem;
      color: var(--primary-10);
      font-weight: 700;
      margin-bottom: 10px;
    }
    .programme-card p {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 14px;
    }
    .programme-card .module-list {

      gap: 6px 16px;

    .programme-card .module-list li {

      color: var(--text-muted);
      padding: 3px 0;

      align-items: center;
      gap: 8px;

    .programme-card .module-list li i {
      color: var(--primary-30);

      box-shadow: var(--shadow-soft);

    }

    }

    .training-item .caption p {

      text-align: center;
      box-shadow: var(--shadow-soft);

      margin-bottom: 4px;

      color: var(--primary-10);
    }
    .promo-banner p {

      opacity: 0.85;
      max-width: 460px;
      margin: 0 auto 12px;
    }
    .promo-banner .btn-gold {
      background: var(--primary-10);
      color: #fff;
    }
    .promo-banner .btn-gold:hover {
      background: #e08e0b;
    }

    /* ============================================================
       TRANSFORM

      background: var(--bg-card);
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);

      gap: 12px;
    }

    /* ============================================================

      font-family: var(--font);
      font-size: 0.9rem;
      transition: var(--transition-fast);
      outline: none;
      -webkit-appearance: none;
